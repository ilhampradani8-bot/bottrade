[package]
name = "bottrade-engine-controller"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bottrade-engine"
path = "src/main.rs"

[[bin]]
name = "analysis-engine"
path = "src/analysis_engine.rs"

[[bin]]
name = "prediction-v2"
path = "src/prediction_v2.rs"

[[bin]]
name = "engine-user-operator"
path = "Engine-User/operator/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "rust_decimal"] }
dotenvy = "0.15"
rust_decimal = "1.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
url = "2.5.8"
futures-util = "0.3.32"
rand = "0.10.1"
qrcode = "0.14.1"
qrcode-generator = "5.0.0"
image = "0.25.10"
reqwest = { version = "0.12", features = ["json"] }
