
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang - Jurnal Trade</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #71b7e6, #9b59b6);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            display: flex;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
        }
        .welcome-panel {
            background: linear-gradient(45deg, #8e44ad, #3498db);
            color: #fff;
            padding: 50px;
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .welcome-panel h1 { font-size: 2.5rem; margin-bottom: 15px; }
        .welcome-panel p { font-size: 1.1rem; max-width: 300px; }
        .form-panel { padding: 50px; width: 55%; position: relative; }
        .form-box { width: 100%; transition: opacity 0.5s ease, transform 0.5s ease; }
        .form-box.hidden { position: absolute; opacity: 0; transform: translateX(20px); pointer-events: none; }
        .form-box h2 { text-align: center; margin-bottom: 25px; font-size: 2rem; color: #333; }
        .input-group { margin-bottom: 20px; position: relative; }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .input-group input:focus { outline: none; border-color: #9b59b6; box-shadow: 0 0 8px rgba(155, 89, 182, 0.3); }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #71b7e6, #9b59b6);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .btn:hover:not(:disabled) { box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .toggle-link { text-align: center; margin-top: 20px; font-size: 0.9rem; }
        .toggle-link a { color: #8e44ad; text-decoration: none; font-weight: 600; cursor: pointer; }
        .message { text-align: center; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-weight: 500; min-height: 40px; display: none;}
        .message.show { display: block; }
        .message.error { background-color: #f8d7da; color: #721c24; }
        .message.success { background-color: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <div class="container">
        <div class="welcome-panel">
            <h1>Jurnal Cuan</h1>
            <p>Catat, analisis, dan tingkatkan performa trading Anda dengan mudah.</p>
        </div>
        <div class="form-panel">

            <!-- FORM LOGIN VIA EMAIL -->
            <div id="email-view" class="form-box">
                <h2>Login</h2>
                <div id="email-message" class="message"></div>
                <form id="email-form">
                    <div class="input-group"><input type="email" id="login-email" name="email" placeholder="Masukkan Email Anda" required></div>
                    <button type="submit" class="btn">Kirim Kode OTP</button>
                </form>
                <div class="toggle-link">Belum punya akun? <a id="show-register">Daftar sekarang</a></div>
            </div>

            <!-- FORM VERIFIKASI OTP -->
            <div id="otp-view" class="form-box hidden">
                <h2>Verifikasi Kode</h2>
                <div id="otp-message" class="message"></div>
                <form id="otp-form">
                    <p style="text-align: center; margin-bottom: 15px;">Kami telah mengirim kode ke <strong id="otp-email-display"></strong></p>
                    <div class="input-group"><input type="text" inputmode="numeric" autocomplete="one-time-code" id="otp-code" name="otp" placeholder="_ _ _ _ _ _" style="text-align: center; letter-spacing: 0.5em;" required></div>
                    <button type="submit" class="btn">Login</button>
                </form>
                <div class="toggle-link">Salah email? <a id="show-email">Kembali</a></div>
            </div>

            <!-- FORM PENDAFTARAN -->
            <div id="register-view" class="form-box hidden">
                <h2>Buat Akun</h2>
                <div id="register-message" class="message"></div>
                <form id="register-form">
                    <div class="input-group"><input type="text" name="nama_pengguna" placeholder="Nama Pengguna" required></div>
                    <div class="input-group"><input type="email" name="email" placeholder="Email" required></div>
                    <div class="input-group"><input type="text" name="nama_lengkap" placeholder="Nama Lengkap (Opsional)"></div>
                    <div class="input-group"><input type="password" name="password" placeholder="Buat Kata Sandi" required></div>
                    <button type="submit" class="btn">Daftar</button>
                </form>
                <div class="toggle-link">Sudah punya akun? <a id="show-login-initial">Login</a></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const API_BASE_URL = '/api';

            if (localStorage.getItem('userToken')) {
                window.location.href = '/frontend/dashboard.html';
                return;
            }

            // Views
            const emailView = document.getElementById('email-view');
            const otpView = document.getElementById('otp-view');
            const registerView = document.getElementById('register-view');

            // Forms
            const emailForm = document.getElementById('email-form');
            const otpForm = document.getElementById('otp-form');
            const registerForm = document.getElementById('register-form');

            // Messages
            const emailMessage = document.getElementById('email-message');
            const otpMessage = document.getElementById('otp-message');
            const registerMessage = document.getElementById('register-message');
            
            // Links & Buttons
            const showRegisterLink = document.getElementById('show-register');
            const showLoginInitialLink = document.getElementById('show-login-initial');
            const showEmailLink = document.getElementById('show-email');

            // Other Elements
            const otpEmailDisplay = document.getElementById('otp-email-display');

            function switchView(viewToShow) {
                [emailView, otpView, registerView].forEach(v => v.classList.add('hidden'));
                viewToShow.classList.remove('hidden');
            }

            function showMessage(element, text, isError = false) {
                element.textContent = text;
                element.className = `message show ${isError ? 'error' : 'success'}`;
            }

            function hideMessage(element) {
                element.classList.remove('show');
            }

            // Event Listeners for switching views
            showRegisterLink.addEventListener('click', (e) => { e.preventDefault(); switchView(registerView); });
            showLoginInitialLink.addEventListener('click', (e) => { e.preventDefault(); switchView(emailView); });
            showEmailLink.addEventListener('click', (e) => { e.preventDefault(); switchView(emailView); });

            // --- FORM HANDLERS ---

            // 1. Request OTP
            emailForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const button = emailForm.querySelector('button');
                const email = emailForm.querySelector('input[name="email"]').value;
                
                button.disabled = true;
                button.textContent = 'Mengirim...';
                hideMessage(emailMessage);

                try {
                    const response = await fetch(`${API_BASE_URL}/request-otp`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.message);
                    
                    otpEmailDisplay.textContent = email;
                    showMessage(otpMessage, result.message, false);
                    switchView(otpView);

                } catch (error) {
                    showMessage(emailMessage, error.message, true);
                } finally {
                    button.disabled = false;
                    button.textContent = 'Kirim Kode OTP';
                }
            });

            // 2. Verify OTP and Login
            otpForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const button = otpForm.querySelector('button');
                const email = otpEmailDisplay.textContent;
                const otp = otpForm.querySelector('input[name="otp"]').value;

                button.disabled = true;
                button.textContent = 'Memverifikasi...';
                hideMessage(otpMessage);

                try {
                    const response = await fetch(`${API_BASE_URL}/verify-otp`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, otp })
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.message);
                    
                    localStorage.setItem('userToken', JSON.stringify({ username: result.username, loggedInAt: new Date().getTime() }));
                    showMessage(otpMessage, result.message, false);
                    setTimeout(() => { window.location.href = '/frontend/dashboard.html'; }, 1000);

                } catch (error) {
                    showMessage(otpMessage, error.message, true);
                } finally {
                    button.disabled = false;
                    button.textContent = 'Login';
                }
            });

            // 3. Register New User
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const button = registerForm.querySelector('button');
                const data = Object.fromEntries(new FormData(registerForm).entries());
                
                button.disabled = true;
                showMessage(registerMessage, 'Mendaftarkan...', false);
                try {
                    const response = await fetch(`${API_BASE_URL}/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    const result = await response.json();
                    if (!response.ok) throw new Error(result.message);
                    
                    showMessage(registerMessage, result.message + " Silakan login dengan email Anda.", false);
                    registerForm.reset();
                    setTimeout(() => switchView(emailView), 2000);
                } catch (error) {
                    showMessage(registerMessage, error.message, true);
                } finally {
                     button.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
