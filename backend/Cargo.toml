[package]
name = "bottrade-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "rust_decimal"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rust_decimal = { version = "1.0", features = ["serde-float"] }
rust_decimal_macros = "1.0"
bcrypt = "0.15"
jsonwebtoken = "9.0"
pyo3 = { version = "0.22", features = ["auto-initialize"] }
openlimits = "0.3.0"
ts-rs = { version = "10.0", features = ["chrono-impl", "serde-json-impl"] }
socketioxide = "0.18.3"
once_cell = "1.21.4"
tokio-tungstenite = "0.29.0"
url = "2.5.8"
futures-util = "0.3.32"
