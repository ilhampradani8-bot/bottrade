
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Trade - Automasi Trading Anda</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
        }
        .header {
            background-color: #ffffff;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
        }
        .nav-buttons a {
            text-decoration: none;
            color: #fff;
            background: linear-gradient(135deg, #71b7e6, #9b59b6);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            transition: box-shadow 0.3s ease;
        }
        .nav-buttons a:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .hero-section {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: calc(100vh - 80px); /* Adjust based on header height */
            padding: 0 20px;
        }
        .hero-content {
            max-width: 800px;
        }
        .hero-content h1 {
            font-size: 3.5rem;
            color: #333;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .hero-content p {
            font-size: 1.25rem;
            color: #555;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">Bot Trade</div>
        <div class="nav-buttons">
            <a href="/frontend/login.html">Login</a>
        </div>
    </header>
    <main class="hero-section">
        <div class="hero-content">
            <h1>Robot Trading</h1>
            <p>Automasi aktivitas trading Anda. Fokus pada strategi, biarkan bot yang bekerja.</p>
        </div>
    </main>
</body>
</html>
