<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Data Market - BotTrade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #0b0f19; color: #e2e8f0; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .input-field { background: #1e293b; border: 1px solid #334155; color: #f8fafc; padding: 0.75rem; border-radius: 0.75rem; width: 100%; transition: all 0.3s; }
        .input-field:focus { border-color: #10b981; outline: none; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="min-h-screen p-6 md:p-10">
    <div class="max-w-4xl mx-auto">
        <header class="mb-10 flex justify-between items-center">
            <div>
                <h1 class="text-4xl font-bold gradient-text">Data Management</h1>
                <p class="text-slate-400 mt-1">Siapkan data historis untuk backtesting.</p>
            </div>
            <a href="admin_tester.html" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm transition-all flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Kembali ke Backtest
            </a>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="glass p-8 rounded-2xl">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-2 text-emerald-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    Ambil Data Baru
                </h2>
                
                <div class="space-y-5">
                    <div class="space-y-2">
                        <label class="text-sm font-semibold text-slate-400">Pilih Aset</label>
                        <select id="pair" class="input-field cursor-pointer"></select>
                    </div>

                    <div class="space-y-2">
                        <label class="text-sm font-semibold text-slate-400">Interval</label>
                        <select id="interval" class="input-field cursor-pointer">
                            <option value="5m">5 Menit</option>
                            <option value="15m">15 Menit</option>
                            <option value="1h">1 Jam</option>
                            <option value="4h">4 Jam</option>
                            <option value="1d">1 Hari</option>
                        </select>
                    </div>

                    <div class="space-y-2">
                        <label class="text-sm font-semibold text-slate-400">Range (Hari)</label>
                        <input type="number" id="days" value="7" class="input-field">
                    </div>

                    <button id="syncBtn" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition-all shadow-lg shadow-emerald-900/20">
                        Ambil & Simpan ke DB
                    </button>
                </div>
            </div>

            <div class="glass p-8 rounded-2xl flex flex-col">
                <h2 class="text-xl font-bold mb-6 flex items-center gap-2 text-blue-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    Log Aktivitas
                </h2>
                <div id="logArea" class="flex-1 bg-black/30 p-4 rounded-xl font-mono text-xs text-slate-400 overflow-y-auto max-h-[300px]">
                    Menunggu perintah...
                </div>
            </div>
        </div>
    </div>

    <script src="admin_getdata.js"></script>
</body>
</html>
